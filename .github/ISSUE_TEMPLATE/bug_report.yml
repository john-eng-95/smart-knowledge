name: Bug report
description: Report a reproducible defect.
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: Numbered steps and sanitized inputs.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js, pnpm, and Docker versions.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed credentials and personal data from this report.
          required: true
